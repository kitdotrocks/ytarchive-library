name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  AUBIO_COMMIT: ad5cf975aed08cc4562dd008cf9f83b12b82ffb8
  AUBIO_VERSION: 0.5.0a0

jobs:
  aubio-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.repository.visibility == 'public')
    name: Build aubio (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            numpy-version: "2.2.6"
          - python-version: "3.11"
            numpy-version: "2.2.6"
          - python-version: "3.12"
            numpy-version: "2.5.2"
          - python-version: "3.13"
            numpy-version: "2.5.2"
          - python-version: "3.14"
            numpy-version: "2.5.2"
    steps:
      - name: Check out pinned aubio source
        uses: actions/checkout@v4
        with:
          repository: aubio/aubio
          ref: ad5cf975aed08cc4562dd008cf9f83b12b82ffb8
          path: aubio-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Verify pinned aubio revision
        shell: pwsh
        run: |
          $actualCommit = git -C aubio-source rev-parse HEAD
          if ($actualCommit -ne $env:AUBIO_COMMIT) {
            throw "Expected aubio $env:AUBIO_COMMIT, checked out $actualCommit."
          }

      - name: Install pinned wheel build dependencies
        run: >-
          python -m pip install --upgrade
          "setuptools==84.0.0"
          "wheel==0.48.0"
          "numpy==${{ matrix.numpy-version }}"

      - name: Build aubio wheel
        run: >-
          python -m pip wheel
          --no-deps
          --no-build-isolation
          --wheel-dir wheelhouse
          ./aubio-source

      - name: Test aubio wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "wheelhouse/aubio-*.whl").FullName
          if (@($wheel).Count -ne 1) { throw "Expected exactly one aubio wheel." }
          python -m pip install --force-reinstall --no-deps $wheel
          python -c "import aubio, numpy; detector = aubio.tempo('default', 1024, 512, 44100); detector(numpy.zeros(512, dtype=aubio.float_type)); print(aubio.version)"

      - name: Record wheel build inputs
        shell: pwsh
        run: |
          $pythonTag = "${{ matrix.python-version }}".Replace(".", "")
          @"
          aubio wheel distributed by ytarchive Library
          Upstream: https://github.com/aubio/aubio
          Commit: $env:AUBIO_COMMIT
          Version: $env:AUBIO_VERSION
          Python: ${{ matrix.python-version }} x64
          NumPy build headers: ${{ matrix.numpy-version }}
          Setuptools: 84.0.0
          Wheel: 0.48.0
          Build command: python -m pip wheel --no-deps --no-build-isolation --wheel-dir wheelhouse ./aubio-source
          License: GPL-3.0-or-later; COPYING is embedded in the wheel and corresponding source archive.
          "@ | Set-Content -Encoding utf8 "wheelhouse/aubio-$env:AUBIO_VERSION-cp$pythonTag-build.txt"

      - name: Archive corresponding aubio source
        if: matrix.python-version == '3.14'
        shell: pwsh
        run: |
          $archive = Join-Path (Get-Location) "wheelhouse/aubio-$env:AUBIO_VERSION-source.zip"
          git -C aubio-source archive --format=zip --prefix="aubio-$env:AUBIO_COMMIT/" --output=$archive HEAD

      - name: Upload aubio wheel and source
        uses: actions/upload-artifact@v4
        with:
          name: aubio-windows-${{ matrix.python-version }}
          path: wheelhouse/*
          if-no-files-found: error

  release:
    # The workflow is present in the private source checkout so it can be
    # exported with the application, but only public-repository tags publish.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.repository.visibility == 'public')
    runs-on: ubuntu-latest
    needs: aubio-windows
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download aubio wheels and corresponding source
        uses: actions/download-artifact@v4
        with:
          pattern: aubio-windows-*
          path: aubio-artifacts
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(python -c 'import ast; nodes=ast.parse(open("__init__.py", encoding="utf-8").read()).body; print(next(node.value.value for node in nodes if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)))')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Stage aubio release artifacts
        shell: bash
        run: |
          test "$(find aubio-artifacts -maxdepth 1 -name 'aubio-*.whl' | wc -l)" -eq 5
          test "$(find aubio-artifacts -maxdepth 1 -name 'aubio-*-build.txt' | wc -l)" -eq 5
          test -f "aubio-artifacts/aubio-${AUBIO_VERSION}-source.zip"
          grep -F "$AUBIO_COMMIT" AUBIO-WHEELS.md
          grep -F "$AUBIO_VERSION" AUBIO-WHEELS.md
          grep -F "$AUBIO_COMMIT" THIRD_PARTY_NOTICES.md
          grep -F "$AUBIO_VERSION" THIRD_PARTY_NOTICES.md
          unzip -Z1 "aubio-artifacts/aubio-${AUBIO_VERSION}-source.zip" | grep -Eq '/COPYING$'
          unzip -Z1 "aubio-artifacts/aubio-${AUBIO_VERSION}-source.zip" | grep -Eq '/AUTHORS$'
          for wheel in aubio-artifacts/aubio-*.whl; do
            unzip -Z1 "$wheel" | grep -Eq '\.dist-info/licenses/COPYING$'
            unzip -Z1 "$wheel" | grep -Eq '\.dist-info/licenses/AUTHORS$'
          done
          cp aubio-artifacts/* dist/
          cp .github/workflows/release.yml "dist/aubio-${AUBIO_VERSION}-build.yml"

      - name: Build guided setup bundle
        shell: bash
        run: |
          bundle_name="ytarchive-lib-${GITHUB_REF_NAME#v}"
          mkdir "$bundle_name"
          mkdir -p "$bundle_name/wheels" "$bundle_name/third-party/aubio"
          cp dist/*.whl "$bundle_name/wheels/"
          cp "dist/aubio-${AUBIO_VERSION}-source.zip" "$bundle_name/third-party/aubio/"
          cp "dist/aubio-${AUBIO_VERSION}-build.yml" "$bundle_name/third-party/aubio/"
          cp dist/aubio-*-build.txt "$bundle_name/third-party/aubio/"
          cp install-linux.sh install-windows.bat README.md FAQ.md LICENSE THIRD_PARTY_NOTICES.md AUBIO-WHEELS.md banner.svg preview.png "$bundle_name/"
          zip -r "dist/${bundle_name}-setup.zip" "$bundle_name"

      - name: Upload manual setup bundle for testing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ytarchive-setup-test-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ytarchive Library $GITHUB_REF_NAME" --generate-notes
