name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ytarchive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ytarchive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ytarchive/pyproject.toml
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          if ldconfig -p | grep -q "libEGL.so.1"; then
            echo "libEGL.so.1 is already available"
            exit 0
          fi
          . /etc/os-release
          qt_sources="$(mktemp)"
          cat > "$qt_sources" <<EOF
          deb https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME} main
          deb https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-updates main
          deb https://archive.ubuntu.com/ubuntu ${VERSION_CODENAME}-security main
          EOF
          sudo timeout 120s apt-get \
            -o Dir::Etc::sourcelist="$qt_sources" \
            -o Dir::Etc::sourceparts="-" \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo timeout 120s apt-get \
            -o Dir::Etc::sourcelist="$qt_sources" \
            -o Dir::Etc::sourceparts="-" \
            install -y --no-install-recommends libegl1
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate Linux setup helper
        if: runner.os == 'Linux'
        run: bash -n install-linux.sh
      - name: Run tests
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest tests --import-mode=importlib -vv --tb=long

  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -U build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ytarchive-lib-python-distributions
          path: dist/
